name: macOS checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline core checks
        run: swift run MoonlightCoreTests
      - name: Build the macOS application
        run: zsh scripts/build-app.sh
      - name: Verify application signature and ZIP
        run: |
          codesign --verify --deep --strict dist/Moonlight.app
          unzip -tq dist/Moonlight-macOS.zip
